{% set version = "2.3.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-tigris
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/tigris_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/tigris/tigris_{{ version }}.tar.gz
  sha256: 721527dd4a6de1263eeb53c2d57d09b8296d33aed5a636ee8cd7ad2c3e009db8

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-dplyr
    - r-httr
    - r-magrittr
    - r-rappdirs
    - r-sf
    - r-stringr
    - r-uuid
  run:
    - r-base
    - r-dplyr
    - r-httr
    - r-magrittr
    - r-rappdirs
    - r-sf
    - r-stringr
    - r-uuid

test:
  commands:
    - $R -e "library('tigris')"           # [not win]
    - "\"%R%\" -e \"library('tigris')\""  # [win]

about:
  home: https://github.com/walkerke/tigris
  license: MIT
  summary: Download TIGER/Line shapefiles from the United States Census Bureau (<https://www.census.gov/geo/maps-data/data/tiger-line.html>) and load into R as 'sf' objects.
  license_family: MIT
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/MIT
    - LICENSE

extra:
  recipe-maintainers:
    - conda-forge/r
    - izahn
